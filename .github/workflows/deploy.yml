name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
      WORKER_D1_DATABASE_ID: ${{ secrets.WORKER_D1_DATABASE_ID }}
      WORKER_ACCESS_TEAM_DOMAIN: ${{ secrets.WORKER_ACCESS_TEAM_DOMAIN }}
      WORKER_ACCESS_AUD: ${{ secrets.WORKER_ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate:remote
      - run: pnpm run deploy
